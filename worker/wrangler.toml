name = "ai-plant"
main = "worker.js"
compatibility_date = "2026-10-06"

[vars]
GROQ_MODEL = "llama-3.3-70b-versatile"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = false
